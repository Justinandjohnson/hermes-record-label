[project]
name = "ai-record-label"
version = "0.1.0"
description = "AI Record Label — audio analysis pipeline and coordination engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "boto3>=1.35",
    "allosaurus>=1.0.2",
    "demucs>=4.0",
    "faster-whisper>=1.0.0",
    "librosa>=0.10.0",
    "pronouncing>=0.2.0",
    "pyloudnorm>=0.1.1",
    "httpx>=0.27",
    "mutagen>=1.47",
    "pyacoustid>=1.3",
    "pydantic>=2.0.0",
    "panns-inference>=0.1.1",
    "requests>=2.31",
    "thefuzz>=0.22",
    "watchdog>=4.0",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.2",
    "soundfile>=0.12",
    "cython>=3.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "audio_analysis",
    "file_watcher",
    "coordination",
    "session_intelligence",
    "stem_separation",
    "publishing",
    "evals",
    "scripts",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "audio_analysis/tests",
  "file_watcher/tests",
  "coordination/tests",
  "session_intelligence/tests",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
